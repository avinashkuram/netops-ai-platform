version: '3.8'

services:
  web-dashboard:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html
    depends_on:
      - backend-api

  backend-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO

  telemetry-broker:
    image: redis:alpine
    ports:
      - "6379:6379"
